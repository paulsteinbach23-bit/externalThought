<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MEMO — Voice Library</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" id="themeColorMeta" content="#f3ede1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MEMO">
<link rel="apple-touch-icon" href="icon_ET.png">

<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">MEMO<span>://</span>LIBRARY</div>
  </div>
  <div class="header-right">
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Theme wechseln">
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
    </button>
    <button class="sort-toggle" id="logoutBtn" onclick="logout()" style="display:none;">ABMELDEN</button>
  </div>
</header>

<div class="app">
  <!-- MAIN -->
  <main class="main">
    <div class="main-header">
      <div class="view-tabs" id="viewTabs">
        <button class="view-tab active" data-view="todos" onclick="setView('todos')">TO-DO</button>
        <button class="view-tab" data-view="inbox" onclick="setView('inbox')">NOTIZEN</button>
        <button class="view-tab" data-view="docs" onclick="setView('docs')">DOKUMENTE</button>
      </div>
      <div class="search-row">
        <input class="search-box" type="text" placeholder="Suchen …" oninput="renderEntries()" id="searchInput">
        <button class="sort-toggle" id="sortToggle" onclick="toggleSort()">↓ NEU</button>
        <button class="sort-toggle" id="newDocBtn" onclick="createIdeaDocument()" style="display:none;">+ NEU</button>
      </div>
    </div>

    <div class="entries" id="entries"></div>

    <div class="status-bar">
      <div>GESAMT <span id="stat-total">0</span></div>
      <div class="sync-indicator" id="syncIndicator" style="margin-left:auto;">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncStatusText">–</span>
      </div>
    </div>
  </main>
</div>

<!-- Floating Action Button -->
<button class="fab" id="fab" onclick="onFabClick()" aria-label="Aufnahme">
  <svg id="fabIcon" xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
    <line x1="12" y1="19" x2="12" y2="23"/>
    <line x1="8" y1="23" x2="16" y2="23"/>
  </svg>
  <svg id="fabStopIcon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="display:none">
    <rect x="4" y="4" width="16" height="16" rx="3"/>
  </svg>
</button>

<!-- RECORDING MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">// AUFNAHME LÄUFT</h2>
    <div class="modal-status" id="modalStatus">
      <div style="display:flex; align-items:center; gap:12px;">
        <div class="waveform">
          <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
        </div>
        <span style="color:var(--accent-rec); font-size:11px; font-family:var(--mono);">Zuhören …</span>
      </div>
    </div>
    <textarea class="modal-review-textarea" id="reviewTextarea" style="display:none" placeholder="Erkannter Text — hier bearbeiten …"></textarea>
    <button class="record-btn recording" id="modalStopBtn" onclick="stopRecording()" style="width:100%; margin-top:4px;">
      <span class="rec-indicator"></span> Aufnahme stoppen
    </button>
    <button class="record-btn" id="modalConfirmBtn" onclick="confirmAndProcess()" style="display:none; width:100%; margin-top:4px; border-color:var(--accent-a); color:var(--accent-a);">
      Speichern →
    </button>
  </div>
</div>

<!-- EDITOR OVERLAY -->
<div class="editor-overlay" id="editorOverlay">
  <div class="editor-container">

    <div class="editor-nav">
      <button class="editor-nav-btn" onclick="closeEditor()">← Zurück</button>
      <span class="editor-nav-title" id="editorNavTitle">// MEMO BEARBEITEN</span>
      <button class="editor-nav-btn editor-save-btn" onclick="saveEditor()">Speichern</button>
    </div>

    <div class="editor-toolbar">
      <select class="toolbar-select" id="fontFamilySelect" onchange="applyFontFamily(this.value)">
        <option value="-apple-system, BlinkMacSystemFont, sans-serif">System</option>
        <option value="Georgia, 'Times New Roman', serif">Serif</option>
        <option value="'SF Mono', 'Courier New', monospace">Monospace</option>
        <option value="'Helvetica Neue', Arial, sans-serif">Helvetica</option>
      </select>
      <select class="toolbar-select toolbar-select--size" id="fontSizeSelect" onchange="applyFontSize(this.value)">
        <option value="12">12</option>
        <option value="13">13</option>
        <option value="14">14</option>
        <option value="15" selected>15</option>
        <option value="16">16</option>
        <option value="18">18</option>
        <option value="20">20</option>
        <option value="24">24</option>
        <option value="28">28</option>
        <option value="32">32</option>
      </select>
      <button class="toolbar-btn" onmousedown="event.preventDefault(); document.execCommand('bold')" title="Fett"><b>B</b></button>
      <button class="toolbar-btn" onmousedown="event.preventDefault(); document.execCommand('italic')" title="Kursiv"><i>I</i></button>
      <div class="toolbar-divider"></div>
      <button class="toolbar-btn toolbar-btn--label" onclick="insertEditorTable()">＋ Tabelle</button>
      <button class="toolbar-btn toolbar-btn--label" onclick="openLLMPrompt()">// LLM</button>
      <button class="toolbar-btn toolbar-btn--label danger" id="editorDeleteBtn" onclick="deleteIdeaDocument(editorId)" style="display:none;">Löschen</button>
      <div class="toolbar-spacer"></div>
      <span class="editor-path-tag" id="editorPathTag"></span>
    </div>

    <div class="editor-body">
      <div class="editor-title-input" id="editorTitle" contenteditable="true" placeholder="Titel …"></div>
      <div class="editor-content" id="editorContent" contenteditable="true" placeholder="Inhalt …"></div>
    </div>

  </div>
</div>

<!-- LLM PROMPT — on demand only, opened via the editor toolbar's "// LLM" button -->
<div class="modal-overlay" id="llmPromptOverlay">
  <div class="modal">
    <h2>// LLM PROMPT</h2>
    <p class="llm-description">Prompt mit Memo-Inhalt — direkt in ein KI-Modell deiner Wahl einfügen</p>
    <textarea class="llm-textarea" id="llmPrompt"></textarea>
    <button class="llm-copy-btn" onclick="copyLLMPrompt()">Prompt kopieren</button>
    <button class="editor-nav-btn" onclick="closeLLMPrompt()">Schließen</button>
  </div>
</div>

<!-- DETAIL VIEW -->
<div class="detail-overlay" id="detailOverlay">
  <div class="detail-container">
    <div class="detail-nav">
      <button class="editor-nav-btn" onclick="navigateBack()">← Zurück</button>
      <span class="detail-nav-path entry-path-tag" id="detailNavPath"></span>
    </div>
    <div class="detail-body">
      <div class="detail-timestamp" id="detailTimestamp"></div>
      <div class="detail-title-row">
        <button class="memo-checkbox" id="detailCheckbox" style="display:none;" aria-label="Erledigt"></button>
        <div class="detail-title" id="detailTitle"></div>
      </div>
      <div class="detail-text" id="detailText"></div>
    </div>
    <div class="detail-actions">
      <button class="btn-small" id="detailEditBtn">BEARBEITEN</button>
      <button class="btn-small" id="detailFileBtn" style="display:none;">EINORDNEN</button>
      <button class="btn-small" id="detailCopyBtn">KOPIEREN</button>
      <button class="btn-small" id="detailDownloadBtn">DOWNLOAD</button>
      <button class="btn-small danger" id="detailDeleteBtn">LÖSCHEN</button>
    </div>
  </div>
</div>

<!-- LOGIN — Supabase Auth (email + password), gates sync when config.js is present -->
<div class="modal-overlay" id="loginOverlay">
  <div class="modal">
    <h2>// ANMELDEN</h2>
    <form id="loginForm" onsubmit="login(event)" style="display:flex; flex-direction:column; gap:12px;">
      <input class="merge-input" id="loginEmail" type="email" placeholder="deine@email.de" required autocomplete="email">
      <input class="merge-input" id="loginPassword" type="password" placeholder="Passwort" required autocomplete="current-password">
      <button class="record-btn" id="loginSubmitBtn" style="border-color:var(--accent-a); color:var(--accent-a);" type="submit">Anmelden →</button>
    </form>
    <div id="loginStatus" style="font-family:var(--mono); font-size:10px; color:var(--text-muted); min-height:14px;"></div>
  </div>
</div>

<!-- MERGE PICKER — file an inbox idea into an idea document -->
<div class="modal-overlay" id="mergePickerOverlay">
  <div class="modal">
    <h2>// IN DOKUMENT EINORDNEN</h2>
    <div class="merge-doc-list" id="mergeDocList"></div>
    <div class="merge-divider">— oder neu —</div>
    <input class="merge-input" id="mergeNewTitle" type="text" placeholder="Neuer Dokumenttitel …">
    <button class="record-btn" style="border-color:var(--accent-a); color:var(--accent-a);" onclick="fileIntoNewDocument()">Neues Dokument erstellen →</button>
    <button class="editor-nav-btn" onclick="closeMergePicker()">Abbrechen</button>
  </div>
</div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
    // sw.js calls skipWaiting()+clients.claim() on every update, but that
    // alone doesn't refresh an already-open tab/PWA instance — it only
    // controls the *next* navigation. Without this listener, a page left
    // open (very common for a home-screen PWA) silently keeps running old
    // HTML/JS indefinitely, even though the new version deployed fine.
    let refreshedOnce = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshedOnce) return;
      refreshedOnce = true;
      location.reload();
    });
  }
</script>
</body>
</html>
